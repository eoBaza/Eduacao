<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f2" />
    <script>
      // Aplica a preferência antes de desenhar a página.
      let theme = 'light'
      try {
        const saved = localStorage.getItem('educacao.theme')
        if (saved === 'dark' || saved === 'light') theme = saved
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
      } catch { /* Usa o tema claro caso o armazenamento esteja indisponível. */ }
      document.documentElement.dataset.theme = theme
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#141719' : '#f7f8f2'
    </script>
    <meta name="description" content="Entre no EducAção e faça parte de uma rede que transforma a educação." />
    <title>Entrar | EducAção</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
